<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login{
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 15px #aaa;
        }

        h2{
            text-align: center;
        }

        input{
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 10px;
            background: #1976d2;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover{
            background: #125aa0;
        }

        #mensaje{
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
   <div class = "login">

        <h2>Iniciar Sesion</h2>

        <form onsubmint="login(event)">
            <input 
                type="text"
                id="usuario"
                placeholder="Usuario"
                required
            >

            <input
                type="password"
                id="clave"
                placeholder="contraseña"
                required
            >    

            <button type="submit">
                Entrar
            </button>
        </form>

        <p id ="mensaje"></p>

    </div>

    <script>
        function login(event) {
            event.preventDefault();
            const usuario = document.getElementById("usuario").value;
            const clave = document.getElementById("clave").value;
            const mensaje = document.getElementById("mensaje");

            if(usuario === "admin" && clave === "1234"){

                sessionStorage.setItem("logueado", "true");

                mensaje.textContent = "Login Correcto. Entrando...";
                mensaje.className = "correcto";

                setTimeout(()=> {
                    window.location.href = "index.html"
                }, 800);

            } else{
                mensaje.textContent = 
                    "Usario o contraseña incorectos";
                mensaje.className = "incorrecto";
            }
        }
    </script>
</body>
</html>
